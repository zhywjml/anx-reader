name: Test CI

on:
  workflow_dispatch

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print system info
        run: |
          echo "CI is working"
          systeminfo
      - name: Test ARM build
        run: flutter build windows --debug --target-platform windows-arm64
